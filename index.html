
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202020">
  <title>VAL WARTE | Customer Lookup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="brand">VW</div>
    <div>VAL WARTE</div>
  </header>

  <main>
    <h1>Customer Account Lookup</h1>
    <p class="subtitle">
      Internal Customer Service Portal
    </p>

    <section class="panel">
      <h3>Search customer accounts</h3>
      <input
        type="search"
        placeholder="Search by name, email, order ID or tracking number..."
      >
      <p>Search functionality coming next.</p>
    </section>

    <section class="stats">
      <div class="stat-card">
        <span>Total Customers</span>
        <strong>10</strong>
      </div>

      <div class="stat-card">
        <span>Total Orders</span>
        <strong>40</strong>
      </div>
    </section>
  </main>

</body>
</html>
